      <section class="power-panel" aria-labelledby="powerHeading">
        <h2 id="powerHeading">Router power</h2>
        <p>Restart briefly disconnects your devices. Power off requires the physical power button to turn the router on again. TTL settings in RAM reset at restart.</p>
        <div class="actions"><button type="button" id="routerReboot" class="secondary">Restart router</button><button type="button" id="routerPowerOff" class="danger">Power off</button></div>
        <p id="powerStatus" class="status" role="status" aria-live="polite">Choose an action, then confirm.</p>
      </section>
