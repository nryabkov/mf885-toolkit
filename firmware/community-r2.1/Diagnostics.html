<div id="mfCommunityDiagnostics" style="max-width:760px;margin:0 auto;padding:14px;color:#243447">
  <h2 style="margin:0 0 6px">Safe Diagnostics</h2>
  <p style="margin:0 0 12px;color:#667085">Manual, read-only status from this MF885. No background polling or native detailed log is used.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
    <button type="button" id="mfDiagRefresh">Refresh diagnostics</button>
    <button type="button" id="mfDiagCopy" disabled>Copy safe snapshot</button>
  </div>
  <div id="mfDiagStatus" role="status" aria-live="polite" style="min-height:22px;margin-bottom:10px">Press Refresh diagnostics to read three fixed endpoints once.</div>
  <div id="mfDiagValues" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 16px"></div>
  <section id="mfDiagCopyFallback" hidden style="margin-top:12px">
    <p>Select and copy this privacy-filtered snapshot manually.</p>
    <textarea id="mfDiagReport" rows="16" readonly style="width:100%;box-sizing:border-box"></textarea>
  </section>
</div>
